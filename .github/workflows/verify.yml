name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check PRG checksums
        run: sha256sum -c SHA256SUMS.txt

      - name: Check PRG sizes
        run: |
          for f in $(cut -d' ' -f3 SHA256SUMS.txt); do
            size=$(stat -c %s "$f")
            echo "$f $size"
            test "$size" -eq 4194304
          done

      - name: Compile Python scripts
        run: python -m py_compile tools/*.py experimental/cachehit-exp02/*.py

      - name: Check documentation links
        run: |
          python - <<'PY'
          import os, re, sys
          bad = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for name in files:
                  if not name.endswith('.md'):
                      continue
                  path = os.path.join(root, name)
                  for target in re.findall(r'\]\(([^)#\s]+)', open(path, encoding='utf-8').read()):
                      if target.startswith(('http://', 'https://', 'mailto:')):
                          continue
                      if not os.path.exists(os.path.normpath(os.path.join(root, target))):
                          bad.append(f'{path}: {target}')
          print('\n'.join(bad) or 'all relative links resolve')
          sys.exit(1 if bad else 0)
          PY
